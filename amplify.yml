version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - |
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm@latest
          fi
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
