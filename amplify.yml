version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - 'if [ -x "$(command -v pnpm)" ]; then echo "pnpm present: $(pnpm -v)"; else npm install -g pnpm@latest || true; fi'
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
