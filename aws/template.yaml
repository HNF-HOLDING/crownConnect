AWSTemplateFormatVersion: '2010-09-09'
Description: CrownConnect production foundation in Africa (Cape Town).

Parameters:
  Environment:
    Type: String
    Default: production
  DatabaseName:
    Type: String
    Default: crownconnect
  DatabaseUsername:
    Type: String
    Default: crownadmin
  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 12

Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3000

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub crownconnect-${Environment}-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: name
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub crownconnect-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub crownconnect-${Environment}
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      EngineVersion: '16.4'
      AllocatedStorage: 20
      StorageType: gp3
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      StorageEncrypted: true

Outputs:
  MediaBucketName:
    Value: !Ref MediaBucket
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
