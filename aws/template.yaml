AWSTemplateFormatVersion: '2010-09-09'
Description: CrownConnect production foundation in Africa (Cape Town).

Parameters:
  Environment:
    Type: String
    Default: production
  DatabaseName:
    Type: String
    Default: crownconnect
  DatabaseUsername:
    Type: String
    Default: crownadmin
  DeployApiPackage:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ApiPackageKey:
    Type: String
    Default: deployments/crownconnect-api.zip

Conditions:
  UsePackagedApi: !Equals [!Ref DeployApiPackage, 'true']

Resources:
  Network:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub crownconnect-${Environment}

  PrivateSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.40.10.0/24

  PrivateSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Network
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.40.11.0/24

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: CrownConnect private database subnets
      SubnetIds: [!Ref PrivateSubnetOne, !Ref PrivateSubnetTwo]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL only from CrownConnect API Lambda
      VpcId: !Ref Network

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CrownConnect API Lambda security group
      VpcId: !Ref Network

  SecretsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow the CrownConnect API to read its database secret
      VpcId: !Ref Network

  SecretsEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SecretsEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref ApiSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Network
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetOne, !Ref PrivateSubnetTwo]
      SecurityGroupIds: [!Ref SecretsEndpointSecurityGroup]

  DatabaseIngressFromApi:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub crownconnect/${Environment}/postgres
      Description: CrownConnect PostgreSQL administrator credentials
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DatabaseUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT]
            AllowedOrigins: ['*']
            MaxAge: 3000

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub crownconnect-${Environment}-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Schema:
        - Name: email
          Required: true
          Mutable: false
        - Name: name
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub crownconnect-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_PASSWORD_AUTH]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub crownconnect-${Environment}
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      AllocatedStorage: 20
      StorageType: gp3
      DBName: !Ref DatabaseName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      StorageEncrypted: true

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CrownConnectMediaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${MediaBucket.Arn}/seller-media/*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub crownconnect-${Environment}-api
      Description: CrownConnect API migration health endpoint
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt ApiExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds: [!Ref ApiSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetOne, !Ref PrivateSubnetTwo]
      Environment:
        Variables:
          APP_ENV: !Ref Environment
          MEDIA_BUCKET: !Ref MediaBucket
          DATABASE_SECRET_ARN: !Ref DatabaseSecret
          DATABASE_HOST: !GetAtt Database.Endpoint.Address
          DATABASE_NAME: !Ref DatabaseName
      Code: !If
        - UsePackagedApi
        - S3Bucket: !Ref MediaBucket
          S3Key: !Ref ApiPackageKey
        - ZipFile: |
            exports.handler = async (event) => ({
              statusCode: event.rawPath === '/health' ? 200 : 404,
              headers: { 'content-type': 'application/json; charset=utf-8', 'access-control-allow-origin': '*' },
              body: JSON.stringify(event.rawPath === '/health' ? { status: 'ok', service: 'crownconnect-api', environment: process.env.APP_ENV } : { error: 'Not found' }),
            });

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub crownconnect-${Environment}-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowHeaders: [content-type, authorization]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        AllowOrigins: ['*']

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !Sub
        - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations
        - FunctionArn: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /health
      Target: !Sub integrations/${ApiIntegration}

  PublicSellersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /sellers
      Target: !Sub integrations/${ApiIntegration}

  PublicSellerDetailsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /sellers/{id}
      Target: !Sub integrations/${ApiIntegration}

  PublicAvailabilityRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /availability
      Target: !Sub integrations/${ApiIntegration}

  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Audience: [!Ref UserPoolClient]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
      Name: !Sub crownconnect-${Environment}-cognito

  AccountRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /account
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  BookingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /bookings
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiUrl:
    Description: CrownConnect AWS API URL. /health is the initial smoke-test endpoint.
    Value: !GetAtt HttpApi.ApiEndpoint
  MediaBucketName:
    Value: !Ref MediaBucket
  CognitoUserPoolId:
    Value: !Ref UserPool
  CognitoClientId:
    Value: !Ref UserPoolClient
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
